<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Spatial mask laboratory</title>
<style>body{margin:0;background:#17212a;color:#faf4e5;font:18px system-ui}main{padding:24px;max-width:960px;margin:auto}h1{font-size:26px;margin:0 0 10px}p{color:#bdc7cd}canvas{width:100%;height:auto;border-radius:4px}button{padding:10px;margin:5px}input{width:95%}</style>
<main><h1>風格由內容決定，遮罩只是可選工具</h1><p id="label"></p><canvas width="960" height="540"></canvas><input type="range" min="0" max="1" step=".001" value="0"><div><button data-kind="directional-wipe">方向性揭露</button><button data-kind="dry-brush">乾刷邊緣</button><button data-kind="ink-spread">墨暈擴散</button></div><p>原創測試圖 · 不是正式教學美術 · 不含配音</p></main>
<script type="module">
import {createField,maskAt,compositeOpaque} from './masks.mjs';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function plate(color,other,label,flip){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');g.fillStyle=color;g.fillRect(0,0,960,540);g.fillStyle=other;for(let i=0;i<6;i++){g.beginPath();g.arc(150+i*150,flip?390:155,55+i*4,0,Math.PI*2);g.fill();}g.fillStyle='#fff8e8';g.font='bold 72px sans-serif';g.fillText(label,64,300);g.font='22px sans-serif';g.fillText('Spatial replacement / one opaque image at each location',64,345);return g.getImageData(0,0,960,540).data;}
const a=plate('#163e4b','#4c8b85','SCENE A',false),b=plate('#9d493d','#d58865','SCENE B',true);
const fields=Object.fromEntries(['directional-wipe','dry-brush','ink-spread'].map(k=>[k,createField(960,540,{kind:k})]));
let current='directional-wipe';
window.renderMask=(kind,p)=>{current=kind;const mask=maskAt(fields[kind],p);ctx.putImageData(new ImageData(compositeOpaque(a,b,mask),960,540),0,0);document.querySelector('#label').textContent=kind+' · '+Math.round(p*100)+'%';document.querySelector('input').value=p;};
document.querySelector('input').oninput=e=>window.renderMask(current,+e.target.value);
document.querySelectorAll('button').forEach(b=>b.onclick=()=>window.renderMask(b.dataset.kind,.5));
window.renderMask(current,0);window.demoReady=true;
</script></html>
